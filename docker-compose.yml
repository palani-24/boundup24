version: '3.8'

services:
  mongodb:
    image: mongo:latest
    container_name: boundup_mongodb
    ports:
      - '27017:27017'
    volumes:
      - mongodb_data:/data/db
    restart: always

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: boundup_api
    ports:
      - '5000:5000'
    environment:
      - NODE_ENV=production
      - MONGODB_URI=mongodb://mongodb:27017/boundup
    depends_on:
      - mongodb

volumes:
  mongodb_data:
